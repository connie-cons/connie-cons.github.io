<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>The King</title>
	<link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>

	<div class="menubar">
		<span class="menubar__apple">
			<svg viewBox="0 0 32 32" width="14" height="14" xmlns="http://www.w3.org/2000/svg">
				<defs>
					<clipPath id="apple-shape">
						<path d="M20.5 4.6c-1.5.1-3.3 1-4.3 2.3-.9 1.1-1.7 2.8-1.4 4.4 1.7.1 3.4-.9 4.4-2.2 1-1.2 1.6-2.9 1.3-4.5z
							M16.2 12c-2.4 0-4.2 1.4-5.3 1.4-1.1 0-2.9-1.3-4.7-1.3-2.4 0-4.6 1.4-5.8 3.6-2.5 4.3-.6 10.7 1.8 14.2 1.2 1.7 2.6 3.7 4.5 3.6 1.8-.1 2.5-1.2 4.6-1.2 2.1 0 2.8 1.2 4.7 1.1 1.9 0 3.2-1.7 4.4-3.5 1.4-2 2-4 2-4.1-.1 0-3.8-1.5-3.8-5.8 0-3.6 2.9-5.3 3.1-5.4-1.7-2.4-4.2-2.7-5.1-2.7-1.9-.2-3.7 1.1-4.4 1.1z"/>
					</clipPath>
				</defs>
				<g clip-path="url(#apple-shape)">
					<rect x="0" y="2" width="32" height="6" fill="#61bb46"/>
					<rect x="0" y="8" width="32" height="6" fill="#fdb827"/>
					<rect x="0" y="14" width="32" height="6" fill="#f5821f"/>
					<rect x="0" y="20" width="32" height="6" fill="#e03a3e"/>
					<rect x="0" y="26" width="32" height="6" fill="#963d97"/>
					<rect x="0" y="32" width="32" height="6" fill="#009ddc"/>
				</g>
			</svg>
		</span>
		<span class="menubar__item">File</span>
		<span class="menubar__item">Help</span>
	</div>

	<div class="desktop">
		<div class="stage" id="stage">

			<div class="window window--console">
				<div class="window__titlebar">
					<span class="window__box window__box--close"></span>
					<span class="window__title">Central Park Control Console</span>
					<span class="window__box window__box--zoom"></span>
				</div>
				<div class="console__body">
					<pre class="console__output" id="console-output"></pre><span class="console__cursor" id="console-cursor">&#9608;</span>
				</div>
			</div>

			<div class="window window--king" id="king-window">
				<div class="window__titlebar">
					<span class="window__box window__box--close" id="king-close"></span>
					<span class="window__title">The King</span>
					<span class="window__box window__box--zoom"></span>
				</div>
				<div class="window__body">
					<div class="window__content">
						<img src="assets/images/dennis-nedry-jurassic-park.gif" alt="The King">
					</div>
					<div class="window__scrollbar">
						<span class="window__scroll-arrow window__scroll-arrow--up">&#9650;</span>
						<div class="window__scroll-track">
							<div class="window__scroll-thumb"></div>
						</div>
						<span class="window__scroll-arrow window__scroll-arrow--down">&#9660;</span>
					</div>
					<div class="window__growbox"></div>
				</div>
			</div>

			<audio id="king-audio" loop>
				<!-- Add your clip: <source src="assets/audio/magic-word.mp3" type="audio/mpeg"> -->
			</audio>

		</div>
	</div>

	<script src="assets/scripts/app.js"></script>

</body>

</html>
